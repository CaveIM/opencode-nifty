name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: OPENCODE_CONFIG_DIR="$RUNNER_TEMP/opencode" ./scripts/install.sh
      - name: Smoke-test VS Code MCP install script
        run: |
          NIFTY_COPILOT_MCP_FILE="$RUNNER_TEMP/vscode-mcp.json" \
          NIFTY_WORKTREE="$RUNNER_TEMP" \
          ./scripts/install-copilot.sh
          node -e "const c = JSON.parse(require('fs').readFileSync('$RUNNER_TEMP/vscode-mcp.json', 'utf8')); if (!c.servers?.nifty?.args) throw new Error('install-copilot.sh produced invalid config')"
      - name: Smoke-test Claude MCP install script
        run: |
          NIFTY_WORKTREE="$RUNNER_TEMP" \
          ./scripts/install-claude.sh
          node -e "const c = JSON.parse(require('fs').readFileSync('.mcp.json', 'utf8')); if (!c.mcpServers?.nifty?.args) throw new Error('install-claude.sh produced invalid config')"
      - name: Smoke-test Cursor MCP install script
        run: |
          NIFTY_WORKTREE="$RUNNER_TEMP" \
          ./scripts/install-cursor.sh
          node -e "const c = JSON.parse(require('fs').readFileSync('.cursor/mcp.json', 'utf8')); if (!c.mcpServers?.nifty?.args) throw new Error('install-cursor.sh produced invalid config')"
      - name: Smoke-test Windsurf MCP install script
        run: |
          NIFTY_WORKTREE="$RUNNER_TEMP" \
          HOME="$RUNNER_TEMP" \
          ./scripts/install-windsurf.sh
          node -e "const c = JSON.parse(require('fs').readFileSync('$RUNNER_TEMP/.codeium/windsurf/mcp_config.json', 'utf8')); if (!c.mcpServers?.nifty?.args) throw new Error('install-windsurf.sh produced invalid config')"
      - name: Smoke-test Codex MCP install script (project-local)
        run: |
          NIFTY_WORKTREE="$RUNNER_TEMP" \
          ./scripts/install-codex.sh
          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('.codex/config.toml', 'utf8');
            if (!raw.includes('[mcp_servers.nifty]')) throw new Error('install-codex.sh missing mcp_servers.nifty section');
            if (!raw.includes('NIFTY_MCP_ROOT')) throw new Error('install-codex.sh missing NIFTY_MCP_ROOT');
            console.log('Codex project-local TOML OK');
          "
      - name: Smoke-test Codex MCP install script (global)
        run: |
          NIFTY_WORKTREE="$RUNNER_TEMP" \
          HOME="$RUNNER_TEMP" \
          ./scripts/install-codex.sh --global
          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('$RUNNER_TEMP/.codex/config.toml', 'utf8');
            if (!raw.includes('[mcp_servers.nifty]')) throw new Error('install-codex.sh --global missing mcp_servers.nifty section');
            if (!raw.includes('NIFTY_MCP_ROOT')) throw new Error('install-codex.sh --global missing NIFTY_MCP_ROOT');
            console.log('Codex global TOML OK');
          "
      - name: Verify MCP server loads and exports correct API
        run: |
          node --input-type=module << 'EOF'
          import { loadNiftyTools, buildMcpToolCatalog, createMcpExecutionContext, startNiftyMcpServer, createNiftyMcpServer, createCopilotExecutionContext } from "./mcp/mcp-server.mjs"
          const tools = await loadNiftyTools()
          if (Object.keys(tools).length < 58) throw new Error("Tool count below expected minimum")
          if (typeof createMcpExecutionContext !== "function") throw new Error("createMcpExecutionContext not exported")
          if (typeof createCopilotExecutionContext !== "function") throw new Error("backward-compat alias missing")
          console.log("MCP server API OK, tools:", Object.keys(tools).length)
          process.exit(0)
          EOF

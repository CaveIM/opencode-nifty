                  - paragraph [ref=e2446]:
                    - text: The plugin manager is exposed as a command with title
                    - code [ref=e2447]: Plugins
                    - text: and value
                    - code [ref=e2448]: plugins.list
                    - text: .
                  - list [ref=e2449]:
                    - listitem [ref=e2450]:
                      - text: Keybind name is
                      - code [ref=e2451]: plugin_manager
                      - text: .
                    - listitem [ref=e2452]:
                      - text: Default keybind is
                      - code [ref=e2453]: none
                      - text: .
                    - listitem [ref=e2454]: It lists both internal and external plugins.
                    - listitem [ref=e2455]:
                      - text: It toggles based on
                      - code [ref=e2456]: active
                      - text: .
                    - listitem [ref=e2457]: Its own row is disabled only inside the manager dialog.
                    - listitem [ref=e2458]:
                      - text: It also exposes command
                      - code [ref=e2459]: plugins.install
                      - text: with title
                      - code [ref=e2460]: Install plugin
                      - text: .
                    - listitem [ref=e2461]:
                      - text: Inside the Plugins dialog, key
                      - code [ref=e2462]: shift+i
                      - text: opens the install prompt.
                    - listitem [ref=e2463]: Install prompt asks for npm package name.
                    - listitem [ref=e2464]:
                      - text: Scope defaults to local, and
                      - code [ref=e2465]: tab
                      - text: toggles local/global.
                    - listitem [ref=e2466]:
                      - text: Install is blocked until
                      - code [ref=e2467]: api.state.path.directory
                      - text: is available; current guard message is
                      - code [ref=e2468]: Paths are still syncing. Try again in a moment.
                      - text: .
                    - listitem [ref=e2469]:
                      - text: Manager install uses
                      - code [ref=e2470]: "api.plugins.install(spec, { global })"
                      - text: .
                    - listitem [ref=e2471]:
                      - text: If the installed package has no
                      - code [ref=e2472]: tui
                      - text: target (
                      - code [ref=e2473]: tui=false
                      - text: ), manager reports that and does not expect a runtime load.
                    - listitem [ref=e2474]:
                      - code [ref=e2475]: tui
                      - text: target detection includes
                      - code [ref=e2476]: exports["./tui"]
                      - text: and valid
                      - code [ref=e2477]: oc-themes
                      - text: .
                    - listitem [ref=e2478]:
                      - text: If install reports
                      - code [ref=e2479]: tui=true
                      - text: ", manager then calls"
                      - code [ref=e2480]: api.plugins.add(spec)
                      - text: .
                    - listitem [ref=e2481]: If runtime add fails, TUI shows a warning and restart remains the fallback.

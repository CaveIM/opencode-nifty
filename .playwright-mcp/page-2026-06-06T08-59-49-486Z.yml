                    - heading "TUI plugins" [level=1] [ref=e1488]
                    - 'link "Permalink: TUI plugins" [ref=e1489] [cursor=pointer]':
                      - /url: "#tui-plugins"
                      - img [ref=e1490]
                  - paragraph [ref=e1492]: Technical reference for the current TUI plugin system.
                  - generic [ref=e1493]:
                    - heading "Overview" [level=2] [ref=e1494]
                    - 'link "Permalink: Overview" [ref=e1495] [cursor=pointer]':
                      - /url: "#overview"
                      - img [ref=e1496]
                  - list [ref=e1498]:
                    - listitem [ref=e1499]:
                      - text: TUI plugin config lives in
                      - code [ref=e1500]: tui.json
                      - text: .
                    - listitem [ref=e1501]:
                      - text: Author package entrypoint is
                      - code [ref=e1502]: "@opencode-ai/plugin/tui"
                      - text: .
                    - listitem [ref=e1503]: Internal plugins load inside the CLI app the same way external TUI plugins do.
                    - listitem [ref=e1504]: Package plugins can be installed from CLI or TUI.
                    - listitem [ref=e1505]:
                      - text: "v1 plugin modules are target-exclusive: a module can export"
                      - code [ref=e1506]: server
                      - text: or
                      - code [ref=e1507]: tui
                      - text: ", never both."
                    - listitem [ref=e1508]: Server runtime keeps v0 legacy fallback (function exports / enumerated exports) after v1 parsing.
                    - listitem [ref=e1509]:
                      - text: npm packages can be TUI theme-only via
                      - code [ref=e1510]: package.json["oc-themes"]
                      - text: without a
                      - code [ref=e1511]: ./tui
                      - text: entrypoint.
                  - generic [ref=e1512]:
                    - heading "TUI config" [level=2] [ref=e1513]
                    - 'link "Permalink: TUI config" [ref=e1514] [cursor=pointer]':
                      - /url: "#tui-config"
                      - img [ref=e1515]
                  - paragraph [ref=e1517]: "Example:"
                  - generic [ref=e1518]:
                    - generic [ref=e1519]:
                      - text: "{ \"$schema\":"
                      - generic [ref=e1520]: "\"https://opencode.ai/tui.json\""
                      - text: ", \"theme\":"
                      - generic [ref=e1521]: "\"smoke-theme\""
                      - text: ", \"leader_timeout\": 2000, \"keybinds\": { \"leader\":"
                      - generic [ref=e1522]: "\"ctrl+x\""
                      - text: ", \"command_list\":"
                      - generic [ref=e1523]: "\"ctrl+p\""
                      - text: ", \"session_new\":"
                      - generic [ref=e1524]: "\"<leader>n\""
                      - text: "}, \"plugin\": ["
                      - generic [ref=e1525]: "\"@acme/opencode-plugin@1.2.3\""
                      - text: ", ["
                      - generic [ref=e1526]: "\"./plugins/demo.tsx\""
                      - text: ", { \"label\":"
                      - generic [ref=e1527]: "\"demo\""
                      - text: "}]], \"plugin_enabled\": { \"acme.demo\": false }, \"attention\": { \"enabled\": true, \"notifications\": true, \"sound\": true, \"volume\": 0.4, \"sound_pack\":"
                      - generic [ref=e1528]: "\"opencode.default\""
                      - text: ", \"sounds\": { \"error\":"
                      - generic [ref=e1529]: "\"/Users/me/sounds/error.mp3\""
                      - text: "} } }"
                    - button "Copy code to clipboard" [ref=e1531] [cursor=pointer]:
                      - img [ref=e1532]
                  - list [ref=e1535]:
                    - listitem [ref=e1536]:
                      - code [ref=e1537]: plugin
                      - text: entries can be either a string spec or
                      - code [ref=e1538]: "[spec, options]"
                      - text: .
                    - listitem [ref=e1539]:
                      - text: Plugin specs can be npm specs,
                      - code [ref=e1540]: file://
                      - text: URLs, relative paths, or absolute paths.
                    - listitem [ref=e1541]: Relative path specs are resolved relative to the config file that declared them.
                    - listitem [ref=e1542]:
                      - text: A file module listed in
                      - code [ref=e1543]: tui.json
                      - text: must be a TUI module (
                      - code [ref=e1544]: "default export { id?, tui }"
                      - text: ) and must not export
                      - code [ref=e1545]: server
                      - text: .
                    - listitem [ref=e1546]: Duplicate npm plugins are deduped by package name; higher-precedence config wins.
                    - listitem [ref=e1547]: Duplicate file plugins are deduped by exact resolved file spec. This happens while merging config, before plugin modules are loaded.
                    - listitem [ref=e1548]:
                      - code [ref=e1549]: plugin_enabled
                      - text: is keyed by plugin id, not by plugin spec.
                    - listitem [ref=e1550]:
                      - text: For file plugins, that id must come from the plugin module's exported
                      - code [ref=e1551]: id
                      - text: . For npm plugins, it is the exported
                      - code [ref=e1552]: id
                      - text: or the package name if
                      - code [ref=e1553]: id
                      - text: is omitted.
                    - listitem [ref=e1554]:
                      - text: Plugins are enabled by default.
                      - code [ref=e1555]: plugin_enabled
                      - text: is only for explicit overrides, usually to disable a plugin with
                      - code [ref=e1556]: "false"
                      - text: .
                    - listitem [ref=e1557]:
                      - text: Internal plugins can declare
                      - code [ref=e1558]: "enabled: false"
                      - text: to be registered but inactive by default;
                      - code [ref=e1559]: plugin_enabled
                      - text: and runtime KV can still enable them by id.
                    - listitem [ref=e1560]:
                      - code [ref=e1561]: plugin_enabled
                      - text: is merged across config layers.
                    - listitem [ref=e1562]:
                      - text: Runtime enable/disable state is also stored in KV under
                      - code [ref=e1563]: plugin_enabled
                      - text: ; that KV state overrides config on startup.
                    - listitem [ref=e1564]:
                      - code [ref=e1565]: attention.enabled
                      - text: defaults to
                      - code [ref=e1566]: "false"
                      - text: ; when
                      - code [ref=e1567]: "false"
                      - text: ", it disables all"
                      - code [ref=e1568]: api.attention.notify(...)
                      - text: delivery.
                    - listitem [ref=e1569]:
                      - code [ref=e1570]: attention.notifications
                      - text: and
                      - code [ref=e1571]: attention.sound
                      - text: independently control terminal-mediated desktop notifications and built-in sounds.
                    - listitem [ref=e1572]:
                      - code [ref=e1573]: attention.volume
                      - text: sets the default built-in sound volume from
                      - code [ref=e1574]: "0"
                      - text: to
                      - code [ref=e1575]: "1"
                      - text: .
                    - listitem [ref=e1576]:
                      - code [ref=e1577]: attention.sound_pack
                      - text: selects the initial semantic sound pack. Persisted runtime selection in KV can override it.
                    - listitem [ref=e1578]:
                      - code [ref=e1579]: attention.sounds
                      - text: overrides individual semantic sound slots such as
                      - code [ref=e1580]: error
                      - text: ","
                      - code [ref=e1581]: done
                      - text: ", or"
                      - code [ref=e1582]: subagent_done
                      - text: .
                    - listitem [ref=e1583]:
                      - code [ref=e1584]: leader_timeout
                      - text: is a top-level TUI setting.
                    - listitem [ref=e1585]:
                      - code [ref=e1586]: keybinds
                      - text: is a flat object keyed by command id; values are key binding values (
                      - code [ref=e1587]: "false"
                      - text: ","
                      - code [ref=e1588]: "\"none\""
                      - text: ", a key string/object, a binding object, or an array of key strings/objects/binding objects)."
                    - listitem [ref=e1589]:
                      - code [ref=e1590]: keybinds.leader
                      - text: sets the key used by
                      - code [ref=e1591]: <leader>
                      - text: shortcuts.
                  - generic [ref=e1592]:
                    - heading "Author package shape" [level=2] [ref=e1593]
                    - 'link "Permalink: Author package shape" [ref=e1594] [cursor=pointer]':
                      - /url: "#author-package-shape"
                      - img [ref=e1595]
                  - paragraph [ref=e1597]: "Package entrypoint:"
                  - list [ref=e1598]:
                    - listitem [ref=e1599]:
                      - text: Import types from
                      - code [ref=e1600]: "@opencode-ai/plugin/tui"
                      - text: .
                    - listitem [ref=e1601]:
                      - code [ref=e1602]: "@opencode-ai/plugin"
                      - text: exports
                      - code [ref=e1603]: ./tui
                      - text: and declares optional peer deps on
                      - code [ref=e1604]: "@opentui/core"
                      - text: and
                      - code [ref=e1605]: "@opentui/solid"
                      - text: .
                  - paragraph [ref=e1606]: "Minimal module shape:"
                  - generic [ref=e1607]:
                    - generic [ref=e1608]:
                      - generic [ref=e1609]: /** @jsxImportSource @opentui/solid */
                      - text: "import type { TuiPlugin, TuiPluginModule } from \"@opencode-ai/plugin/tui\" const tui: TuiPlugin = async (api, options, meta) => { api.keymap.registerLayer({ commands: [ { name: \"demo.open\", title: \"Demo\", category: \"Plugin\", namespace: \"palette\", slashName: \"demo\", run() { api.route.navigate(\"demo\") }, }, ], bindings: [{ key: \"ctrl+shift+m\", cmd: \"demo.open\", desc: \"Open demo\" }], }) api.route.register([ { name: \"demo\", render: () => ( <box> <text>demo</text> </box> ), }, ]) } const plugin: TuiPluginModule & { id: string } = { id: \"acme.demo\", tui, } export default plugin"
                    - button "Copy code to clipboard" [ref=e1611] [cursor=pointer]:
                      - img [ref=e1612]
                  - list [ref=e1615]:
                    - listitem [ref=e1616]: Loader only reads the module default export object. Named exports are ignored.
                    - listitem [ref=e1617]:
                      - text: TUI shape is
                      - code [ref=e1618]: "default export { id?, tui }"
                      - text: ; including
                      - code [ref=e1619]: server
                      - text: is rejected.
                    - listitem [ref=e1620]:
                      - text: A single module cannot export both
                      - code [ref=e1621]: server
                      - text: and
                      - code [ref=e1622]: tui
                      - text: .
                    - listitem [ref=e1623]:
                      - code [ref=e1624]: tui
                      - text: signature is
                      - code [ref=e1625]: (api, options, meta) => Promise<void>
                      - text: .
                    - listitem [ref=e1626]:
                      - text: If package
                      - code [ref=e1627]: exports
                      - text: contains
                      - code [ref=e1628]: ./tui
                      - text: ", the loader resolves that entrypoint."
                    - listitem [ref=e1629]:
                      - text: If package
                      - code [ref=e1630]: exports
                      - text: exists, loader only resolves
                      - code [ref=e1631]: ./tui
                      - text: or
                      - code [ref=e1632]: ./server
                      - text: ; it never falls back to
                      - code [ref=e1633]: exports["."]
                      - text: .
                    - listitem [ref=e1634]:
                      - text: For npm package specs, TUI does not use
                      - code [ref=e1635]: package.json
                      - code [ref=e1636]: main
                      - text: as a fallback entry.
                    - listitem [ref=e1637]:
                      - code [ref=e1638]: package.json
                      - code [ref=e1639]: main
                      - text: is only used for server plugin entrypoint resolution.
                    - listitem [ref=e1640]:
                      - text: If a configured TUI package has no
                      - code [ref=e1641]: ./tui
                      - text: entrypoint and no valid
                      - code [ref=e1642]: oc-themes
                      - text: ", it is skipped with a warning (not a load failure)."
                    - listitem [ref=e1643]:
                      - text: If a configured TUI package has no
                      - code [ref=e1644]: ./tui
                      - text: entrypoint but has valid
                      - code [ref=e1645]: oc-themes
                      - text: ", runtime creates a no-op module record and still loads it for theme sync and plugin state."
                    - listitem [ref=e1646]:
                      - text: If a package supports both server and TUI, use separate files and package
                      - code [ref=e1647]: exports
                      - text: (
                      - code [ref=e1648]: ./server
                      - text: and
                      - code [ref=e1649]: ./tui
                      - text: ) so each target resolves to a target-only module.
                    - listitem [ref=e1650]:
                      - text: File/path plugins must export a non-empty
                      - code [ref=e1651]: id
                      - text: .
                    - listitem [ref=e1652]:
                      - text: npm plugins may omit
                      - code [ref=e1653]: id
                      - text: ; package
                      - code [ref=e1654]: name
                      - text: is used.
                    - listitem [ref=e1655]: Runtime identity is the resolved plugin id. Later plugins with the same id are rejected, including collisions with internal plugin ids.
                    - listitem [ref=e1656]:
                      - text: If a path spec points at a directory, server loading can use
                      - code [ref=e1657]: package.json
                      - code [ref=e1658]: main
                      - text: .
                    - listitem [ref=e1659]:
                      - text: TUI path loading never uses
                      - code [ref=e1660]: package.json
                      - code [ref=e1661]: main
                      - text: .
                    - listitem [ref=e1662]:
                      - text: "Legacy compatibility: path specs like"
                      - code [ref=e1663]: ./plugin
                      - text: can resolve to
                      - code [ref=e1664]: ./plugin/index.ts
                      - text: (or
                      - code [ref=e1665]: index.js
                      - text: ) when
                      - code [ref=e1666]: package.json
